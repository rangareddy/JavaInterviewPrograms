<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 870" width="1280" height="870" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title>8 coding interview patterns with Java data structures</title>
<rect width="1280" height="870" fill="#0F172A"/>
<text x="640" y="52" text-anchor="middle" font-size="34" font-weight="700" fill="#F8FAFC">8 Patterns That Solve Most LeetCode Problems</text>
<text x="640" y="82" text-anchor="middle" font-size="16" fill="#94A3B8">Spot the clue, pick the pattern, reach for the Java data structure</text>
<rect x="30" y="110" width="290" height="340" rx="14" fill="#1E293B" stroke="#2563EB" stroke-width="2"/>
<path d="M30 124 a14 14 0 0 1 14 -14 h262 a14 14 0 0 1 14 14 v36 h-290 z" fill="#2563EB"/>
<text x="46" y="144" font-size="20" font-weight="700" fill="#fff">1. Sliding Window</text>
<text x="46" y="186" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="1">CLUE</text>
<text x="46" y="203" font-size="14" fill="#E2E8F0">Contiguous subarray or substring,</text>
<text x="46" y="220" font-size="14" fill="#E2E8F0">max / min / longest</text>
<text x="46" y="246" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="1">USE</text>
<text x="46" y="263" font-size="14" fill="#E2E8F0">HashMap · HashSet · int[]</text>
<text x="46" y="293" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="1">IDEA</text>
<text x="46" y="310" font-size="14" fill="#E2E8F0">expand right, shrink left</text>
<text x="46" y="340" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="1">TIME</text>
<text x="46" y="357" font-size="14" fill="#E2E8F0">O(n)</text>
<text x="46" y="387" font-size="11" font-weight="700" fill="#2563EB" letter-spacing="1">TRY</text>
<text x="46" y="404" font-size="14" fill="#E2E8F0">Longest Substring Without Repeats</text>
<rect x="340" y="110" width="290" height="340" rx="14" fill="#1E293B" stroke="#7C3AED" stroke-width="2"/>
<path d="M340 124 a14 14 0 0 1 14 -14 h262 a14 14 0 0 1 14 14 v36 h-290 z" fill="#7C3AED"/>
<text x="356" y="144" font-size="20" font-weight="700" fill="#fff">2. Two Pointers</text>
<text x="356" y="186" font-size="11" font-weight="700" fill="#7C3AED" letter-spacing="1">CLUE</text>
<text x="356" y="203" font-size="14" fill="#E2E8F0">Sorted array, target pair or</text>
<text x="356" y="220" font-size="14" fill="#E2E8F0">triplet, in-place edits</text>
<text x="356" y="246" font-size="11" font-weight="700" fill="#7C3AED" letter-spacing="1">USE</text>
<text x="356" y="263" font-size="14" fill="#E2E8F0">indices left, right</text>
<text x="356" y="293" font-size="11" font-weight="700" fill="#7C3AED" letter-spacing="1">IDEA</text>
<text x="356" y="310" font-size="14" fill="#E2E8F0">move the side that fixes the sum</text>
<text x="356" y="340" font-size="11" font-weight="700" fill="#7C3AED" letter-spacing="1">TIME</text>
<text x="356" y="357" font-size="14" fill="#E2E8F0">O(n)</text>
<text x="356" y="387" font-size="11" font-weight="700" fill="#7C3AED" letter-spacing="1">TRY</text>
<text x="356" y="404" font-size="14" fill="#E2E8F0">3Sum</text>
<rect x="650" y="110" width="290" height="340" rx="14" fill="#1E293B" stroke="#0891B2" stroke-width="2"/>
<path d="M650 124 a14 14 0 0 1 14 -14 h262 a14 14 0 0 1 14 14 v36 h-290 z" fill="#0891B2"/>
<text x="666" y="144" font-size="20" font-weight="700" fill="#fff">3. Binary Search</text>
<text x="666" y="186" font-size="11" font-weight="700" fill="#0891B2" letter-spacing="1">CLUE</text>
<text x="666" y="203" font-size="14" fill="#E2E8F0">Sorted or rotated array, minimize</text>
<text x="666" y="220" font-size="14" fill="#E2E8F0">the maximum</text>
<text x="666" y="246" font-size="11" font-weight="700" fill="#0891B2" letter-spacing="1">USE</text>
<text x="666" y="263" font-size="14" fill="#E2E8F0">indices low, high</text>
<text x="666" y="293" font-size="11" font-weight="700" fill="#0891B2" letter-spacing="1">IDEA</text>
<text x="666" y="310" font-size="14" fill="#E2E8F0">halve [low, high), feasible(mid)</text>
<text x="666" y="340" font-size="11" font-weight="700" fill="#0891B2" letter-spacing="1">TIME</text>
<text x="666" y="357" font-size="14" fill="#E2E8F0">O(log n)</text>
<text x="666" y="387" font-size="11" font-weight="700" fill="#0891B2" letter-spacing="1">TRY</text>
<text x="666" y="404" font-size="14" fill="#E2E8F0">Koko Eating Bananas</text>
<rect x="960" y="110" width="290" height="340" rx="14" fill="#1E293B" stroke="#DC2626" stroke-width="2"/>
<path d="M960 124 a14 14 0 0 1 14 -14 h262 a14 14 0 0 1 14 14 v36 h-290 z" fill="#DC2626"/>
<text x="976" y="144" font-size="20" font-weight="700" fill="#fff">4. Heap / Top K</text>
<text x="976" y="186" font-size="11" font-weight="700" fill="#DC2626" letter-spacing="1">CLUE</text>
<text x="976" y="203" font-size="14" fill="#E2E8F0">Top K, K-th largest or smallest, K</text>
<text x="976" y="220" font-size="14" fill="#E2E8F0">closest</text>
<text x="976" y="246" font-size="11" font-weight="700" fill="#DC2626" letter-spacing="1">USE</text>
<text x="976" y="263" font-size="14" fill="#E2E8F0">PriorityQueue</text>
<text x="976" y="293" font-size="11" font-weight="700" fill="#DC2626" letter-spacing="1">IDEA</text>
<text x="976" y="310" font-size="14" fill="#E2E8F0">min-heap of size K</text>
<text x="976" y="340" font-size="11" font-weight="700" fill="#DC2626" letter-spacing="1">TIME</text>
<text x="976" y="357" font-size="14" fill="#E2E8F0">O(n log k)</text>
<text x="976" y="387" font-size="11" font-weight="700" fill="#DC2626" letter-spacing="1">TRY</text>
<text x="976" y="404" font-size="14" fill="#E2E8F0">Kth Largest Element</text>
<rect x="30" y="470" width="290" height="340" rx="14" fill="#1E293B" stroke="#EA580C" stroke-width="2"/>
<path d="M30 484 a14 14 0 0 1 14 -14 h262 a14 14 0 0 1 14 14 v36 h-290 z" fill="#EA580C"/>
<text x="46" y="504" font-size="20" font-weight="700" fill="#fff">5. Monotonic Stack</text>
<text x="46" y="546" font-size="11" font-weight="700" fill="#EA580C" letter-spacing="1">CLUE</text>
<text x="46" y="563" font-size="14" fill="#E2E8F0">Next greater or smaller element</text>
<text x="46" y="589" font-size="11" font-weight="700" fill="#EA580C" letter-spacing="1">USE</text>
<text x="46" y="606" font-size="14" fill="#E2E8F0">ArrayDeque (indices)</text>
<text x="46" y="636" font-size="11" font-weight="700" fill="#EA580C" letter-spacing="1">IDEA</text>
<text x="46" y="653" font-size="14" fill="#E2E8F0">pop while the new item beats the</text>
<text x="46" y="670" font-size="14" fill="#E2E8F0">top</text>
<text x="46" y="700" font-size="11" font-weight="700" fill="#EA580C" letter-spacing="1">TIME</text>
<text x="46" y="717" font-size="14" fill="#E2E8F0">O(n)</text>
<text x="46" y="747" font-size="11" font-weight="700" fill="#EA580C" letter-spacing="1">TRY</text>
<text x="46" y="764" font-size="14" fill="#E2E8F0">Daily Temperatures</text>
<rect x="340" y="470" width="290" height="340" rx="14" fill="#1E293B" stroke="#059669" stroke-width="2"/>
<path d="M340 484 a14 14 0 0 1 14 -14 h262 a14 14 0 0 1 14 14 v36 h-290 z" fill="#059669"/>
<text x="356" y="504" font-size="20" font-weight="700" fill="#fff">6. BFS</text>
<text x="356" y="546" font-size="11" font-weight="700" fill="#059669" letter-spacing="1">CLUE</text>
<text x="356" y="563" font-size="14" fill="#E2E8F0">Shortest path (unweighted), level</text>
<text x="356" y="580" font-size="14" fill="#E2E8F0">by level</text>
<text x="356" y="606" font-size="11" font-weight="700" fill="#059669" letter-spacing="1">USE</text>
<text x="356" y="623" font-size="14" fill="#E2E8F0">ArrayDeque as Queue</text>
<text x="356" y="653" font-size="11" font-weight="700" fill="#059669" letter-spacing="1">IDEA</text>
<text x="356" y="670" font-size="14" fill="#E2E8F0">mark visited on enqueue, loop per</text>
<text x="356" y="687" font-size="14" fill="#E2E8F0">level</text>
<text x="356" y="717" font-size="11" font-weight="700" fill="#059669" letter-spacing="1">TIME</text>
<text x="356" y="734" font-size="14" fill="#E2E8F0">O(V + E)</text>
<text x="356" y="764" font-size="11" font-weight="700" fill="#059669" letter-spacing="1">TRY</text>
<text x="356" y="781" font-size="14" fill="#E2E8F0">Rotting Oranges</text>
<rect x="650" y="470" width="290" height="340" rx="14" fill="#1E293B" stroke="#BE185D" stroke-width="2"/>
<path d="M650 484 a14 14 0 0 1 14 -14 h262 a14 14 0 0 1 14 14 v36 h-290 z" fill="#BE185D"/>
<text x="666" y="504" font-size="20" font-weight="700" fill="#fff">7. Backtracking</text>
<text x="666" y="546" font-size="11" font-weight="700" fill="#BE185D" letter-spacing="1">CLUE</text>
<text x="666" y="563" font-size="14" fill="#E2E8F0">All combinations, permutations,</text>
<text x="666" y="580" font-size="14" fill="#E2E8F0">subsets</text>
<text x="666" y="606" font-size="11" font-weight="700" fill="#BE185D" letter-spacing="1">USE</text>
<text x="666" y="623" font-size="14" fill="#E2E8F0">recursion + ArrayList</text>
<text x="666" y="653" font-size="11" font-weight="700" fill="#BE185D" letter-spacing="1">IDEA</text>
<text x="666" y="670" font-size="14" fill="#E2E8F0">choose, explore, un-choose, prune</text>
<text x="666" y="700" font-size="11" font-weight="700" fill="#BE185D" letter-spacing="1">TIME</text>
<text x="666" y="717" font-size="14" fill="#E2E8F0">O(n · 2ⁿ) / O(n · n!)</text>
<text x="666" y="747" font-size="11" font-weight="700" fill="#BE185D" letter-spacing="1">TRY</text>
<text x="666" y="764" font-size="14" fill="#E2E8F0">Subsets</text>
<rect x="960" y="470" width="290" height="340" rx="14" fill="#1E293B" stroke="#CA8A04" stroke-width="2"/>
<path d="M960 484 a14 14 0 0 1 14 -14 h262 a14 14 0 0 1 14 14 v36 h-290 z" fill="#CA8A04"/>
<text x="976" y="504" font-size="20" font-weight="700" fill="#fff">8. Merge Intervals</text>
<text x="976" y="546" font-size="11" font-weight="700" fill="#CA8A04" letter-spacing="1">CLUE</text>
<text x="976" y="563" font-size="14" fill="#E2E8F0">Overlapping intervals, meeting</text>
<text x="976" y="580" font-size="14" fill="#E2E8F0">rooms</text>
<text x="976" y="606" font-size="11" font-weight="700" fill="#CA8A04" letter-spacing="1">USE</text>
<text x="976" y="623" font-size="14" fill="#E2E8F0">Arrays.sort + ArrayList</text>
<text x="976" y="653" font-size="11" font-weight="700" fill="#CA8A04" letter-spacing="1">IDEA</text>
<text x="976" y="670" font-size="14" fill="#E2E8F0">sort by start, extend end with max</text>
<text x="976" y="700" font-size="11" font-weight="700" fill="#CA8A04" letter-spacing="1">TIME</text>
<text x="976" y="717" font-size="14" fill="#E2E8F0">O(n log n)</text>
<text x="976" y="747" font-size="11" font-weight="700" fill="#CA8A04" letter-spacing="1">TRY</text>
<text x="976" y="764" font-size="14" fill="#E2E8F0">Merge Intervals</text>
<text x="640" y="850" text-anchor="middle" font-size="13" fill="#64748B">JavaInterviewPrograms · full templates in README "Pattern Cheat Sheet" and NOTES.md</text>
</svg>